<!-- ENQUIRY -->
<div id="enquiry">
    <h2>Enquiry Form</h2>
    <p>Interested in a car or want to see our accessories in person? Send us a message.</p>
    
    <form action="mailto:info@dreamgarage.co.za" method="post" enctype="text/plain">
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>
        
        <label>Email:</label><br>
        <input type="text" name="email"><br><br>
        
        <label>Phone:</label><br>
        <input type="text" name="phone"><br><br>
        
        <label>Category Interested In:</label><br>
        <select name="category">
            <option>Track Focused</option>
            <option>High Performance Cars</option>
            <option>SUVs</option>
            <option>JDM</option>
        </select><br><br>
        
        <label>Message:</label><br>
        <textarea name="message" rows="5" cols="40"></textarea><br><br>
        
        <input type="submit" value="Send Enquiry">
        <input type="reset" value="Clear">
    </form>
</div>
